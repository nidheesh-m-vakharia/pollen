<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pollen banner</title>
<!-- Source for assets/banner.png. Render at 1280x640 (e.g. a headless browser screenshot of #banner). -->
<style>
  @font-face { font-family: "Pollen"; src: url("../fonts/Pollen[ROND,wght].woff2") format("woff2"); font-weight: 400 700; }
  html, body { margin: 0; background: #f9f9fb; }
  #banner {
    position: relative; width: 1280px; height: 640px; overflow: hidden; box-sizing: border-box;
    padding: 72px 88px; background: #f9f9fb; color: #3b3f45; font-family: "Pollen", sans-serif;
    display: grid; grid-template-rows: 1fr auto;
    -webkit-font-smoothing: antialiased;
  }
  .word { margin: 0; font-size: 232px; line-height: 0.9; letter-spacing: -0.045em; font-weight: 400; align-self: center; }
  .word span { display: inline-block; }
  .foot { display: flex; justify-content: space-between; align-items: end; gap: 32px; }
  .lede { margin: 0; font-size: 30px; line-height: 1.3; color: #60646c; letter-spacing: -0.01em; }
  .lede b { color: #3b3f45; font-weight: 600; }
  .axes { display: flex; gap: 12px; }
  .axis { font-size: 20px; color: #60646c; background: #e8e8ec; border-radius: 999px; padding: 10px 18px; }
  .axis b { color: #3b3f45; font-weight: 600; margin-right: 6px; }
  .rule { position: absolute; left: 88px; right: 88px; bottom: 170px; height: 3px; border-radius: 3px; background: #e0e1e6; }
</style>
</head>
<body>
<div id="banner">
  <!-- the word walks the design space: light and round on the left, heavy and sharp on the right -->
  <p class="word" aria-label="Pollen">
    <span style="font-weight:400;font-variation-settings:'ROND' 100">P</span><span style="font-weight:460;font-variation-settings:'ROND' 80">o</span><span style="font-weight:520;font-variation-settings:'ROND' 60">l</span><span style="font-weight:580;font-variation-settings:'ROND' 40">l</span><span style="font-weight:640;font-variation-settings:'ROND' 20">e</span><span style="font-weight:700;font-variation-settings:'ROND' 0">n</span>
  </p>
  <div class="rule"></div>
  <div class="foot">
    <p class="lede"><b>A variable typeface</b> by Nidheesh Vakharia<br>Built from Open Runde and Inter · SIL OFL 1.1</p>
    <div class="axes">
      <span class="axis"><b>wght</b>400–700</span>
      <span class="axis"><b>ROND</b>0–100</span>
    </div>
  </div>
</div>
</body>
</html>
