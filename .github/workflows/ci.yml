name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build the font
        run: python scripts/build.py

      - name: Check the font
        run: python scripts/check.py

      - name: Upload fonts
        uses: actions/upload-artifact@v4
        with:
          name: pollen-fonts
          path: fonts/
